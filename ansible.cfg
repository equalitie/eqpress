[defaults]
inventory = config/inventory
no_target_syslog = True
roles_path = roles
interpreter_python = auto
# Get .ansible out of home dir.
# Needed for some tasks where home dir needs
# to be empty, ie; .git
remote_tmp = /tmp/ansible-$USER
stdout_callback = debug
cow_selection = tux

[privilege_escalation]
#become_ask_pass = True

[ssh_connection]
# ControlMaster/ControlPersist enable connection multiplexing (Ansible's default,
# which a bare ssh_args would otherwise clobber) so a deploy reuses one SSH
# connection per host instead of flooding sshd's MaxStartups limit.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=yes
pipelining = True
