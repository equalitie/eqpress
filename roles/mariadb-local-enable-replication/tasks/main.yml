---
- name: set correct mysql replication mode variables if ansible is <= {{ ansible_rename_replica_ident }}
  ansible.builtin.set_fact:
    getreplica: "getslave"
    startreplica: "startslave"
    changeprimary: "changemaster"
  when:
    - ansible_version.full is version(ansible_rename_replica_ident, '<=')
  tags:
    - mysql
    - mysql_resync

- name: Create the replication user on the master
  become: true
  community.mysql.mysql_user:
    name: "{{ mysql_repl_creds.username }}"
    host: "{{ item }}"
    password: "{{ mysql_repl_creds.password }}"
    priv: "*.*:REPLICATION SLAVE"
    # the slave always connects with TLS (master_ssl below); refuse plain text
    tls_requires:
      SSL:
    state: present
    login_unix_socket: "{{ mariadb_unix_socket }}"
  loop:
    - "{{ hostvars[inventory_hostname].mysql_repl_slave }}"
    - "{{ hostvars[mysql_repl_slave].public_ipv4_address }}"
  no_log: true
  when:
   - mysql_repl_role is defined
   - mysql_repl_role == "master"
  tags:
    - mysql

# The mysqladmin user (SUPER,PROCESS) came with the inherited playbooks for
# monitoring scripts that no longer exist; nothing uses it. Remove it and its
# client files. The DROP USER on the master replicates to the slave.
- name: Remove the unused mysqladmin user on master
  become: true
  community.mysql.mysql_user:
    name: "{{ mysql_admin_user.username | default('mysqladmin') }}"
    host_all: true
    state: absent
    login_unix_socket: "{{ mariadb_unix_socket }}"
  when:
    - mysql_repl_role is defined
    - mysql_repl_role == 'master'
  tags:
    - mysql

- name: Remove the unused .my.cnf-mysqladmin files
  become: true
  ansible.builtin.file:
    path: "{{ item }}/.my.cnf-mysqladmin"
    state: absent
  loop:
    - /root
    - "{{ ansible_facts['user_dir'] }}"
  when:
    - mysql_repl_role is defined
  tags:
    - mysql

- name: get replica replication status
  become: true
  community.mysql.mysql_replication:
    mode: "{{ getreplica | default('getreplica') }}"
    login_unix_socket: "{{ mariadb_unix_socket }}"
  when:
    - mysql_repl_role is defined
    - mysql_repl_role == 'slave'
  register: replica
  no_log: true
  tags:
    - mysql
    - mysql_resync

- name: tell all we are going to create replica if needed
  ansible.builtin.set_fact:
    sync_replica: true
  when:
    - mysql_repl_role is defined
    - mysql_repl_role == 'slave'
    - (replica.Is_Replica is defined and not replica.Is_Replica) or (replica.Is_Slave is defined and not replica.Is_Slave) 
  delegate_facts: true
  delegate_to: "{{ item }}"
  loop: "{{ play_hosts }}"
  tags:
    - mysql
    - mysql_resync

# We only go in this block when building replica
- block:
    # Space check first, while nothing is stopped yet. Binlogs and relay logs
    # are left out because mariabackup does not copy them.
    - name: measure the database size on master
      become: true
      ansible.builtin.command:
        cmd: du -sb --exclude=mysql_bin.* --exclude=relay_bin.* {{ mariadb_datadir }}
      register: resync_db_size
      changed_when: false
      check_mode: false
      when:
        - mysql_repl_role == 'master'

    - name: check there is enough disk space for the resync
      become: true
      vars:
        db_bytes: "{{ (ansible_play_batch | map('extract', hostvars) | selectattr('resync_db_size', 'defined')
                       | selectattr('resync_db_size.stdout', 'defined') | map(attribute='resync_db_size.stdout')
                       | first).split()[0] }}"
      ansible.builtin.script:
        cmd: >-
          eq_resync_space_check.sh
          {% if mysql_repl_role == 'master' %}
          {{ db_bytes }}:{{ mariadb_resync_dir }}/backup
          {{ db_bytes }}:{{ mariadb_resync_dir }}/master-snapshot.tar.bz2
          {% else %}
          {{ db_bytes }}:{{ mariadb_resync_dir }}/master-snapshot.tar.bz2
          {{ db_bytes }}:/var/lib/mariadb_master_snapshot
          {{ db_bytes }}:{{ mariadb_datadir }}
          {% endif %}
      changed_when: false
      check_mode: false

    # Owned by the admin user: synchronize copies the archive without become
    - name: create the resync work folder
      become: true
      ansible.builtin.file:
        path: "{{ mariadb_resync_dir }}"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: "0700"

    - name: stop the mysql server on the slave
      become: true
      ansible.builtin.systemd_service:
        name: mariadb
        state: stopped
      when:
        - mysql_repl_role == 'slave'

    - name: stat mysql directory on slave
      become: true
      ansible.builtin.stat:
        path: "{{ mariadb_datadir }}"
      register: mysql_dir_stat
      when:
        - mysql_repl_role == 'slave'

    # This is for safety. Really not needed. We need to cleanup sometimes
    - name: move "{{ mariadb_datadir }}" if exists on slave
      become: true
      ansible.builtin.command:
        cmd: "mv {{ mariadb_datadir }} {{ mariadb_datadir }}-{{ ansible_facts.date_time.iso8601_basic_short }}"
        creates: "{{ mariadb_datadir }}-{{ ansible_facts.date_time.iso8601_basic_short }}"
      when:
        - mysql_repl_role == 'slave'
        - mysql_dir_stat.stat.exists

    - name: create temp directory for transferring master snapshot
      become: true
      ansible.builtin.file:
        path: "/var/lib/mariadb_master_snapshot/{{ ansible_facts.date_time.iso8601_basic_short }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
        recurse: true
      when:
        - mysql_repl_role == 'slave'

    - name: remove any old attempts on master
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      when:
        - mysql_repl_role == 'master'
      loop:
        - "{{ mariadb_resync_dir }}/master-snapshot.tar.bz2"
        - "{{ mariadb_resync_dir }}/backup"

    - name: create backup on master
      become: true
      ansible.builtin.command:
        cmd: mariabackup --backup --target-dir {{ mariadb_resync_dir }}/backup -u root
      when:
        - mysql_repl_role == 'master'

    - name: create current tar.bz2 of snapshot on master
      become: true
      ansible.builtin.archive:
        path:
          - "{{ mariadb_resync_dir }}/backup/*"
        dest: "{{ mariadb_resync_dir }}/master-snapshot.tar.bz2"
        format: bz2
      when:
        - mysql_repl_role == 'master'

    - name: send the master snapshot archive to the slave
      ansible.builtin.synchronize:
        src: "{{ mariadb_resync_dir }}/master-snapshot.tar.bz2"
        dest: "{{ mariadb_resync_dir }}/master-snapshot.tar.bz2"
        mode: push
      delegate_to: "{{ item }}"
      loop: "{{ play_hosts }}"
      when:
        - mysql_repl_role == 'slave'
        - item != inventory_hostname

    - name: cleanup attempts on master
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      when:
        - mysql_repl_role == 'master'
      loop:
        - "{{ mariadb_resync_dir }}/master-snapshot.tar.bz2"
        - "{{ mariadb_resync_dir }}/backup"

    - name: unarchive snapshot to slave
      become: true
      ansible.builtin.unarchive:
        src: "{{ mariadb_resync_dir }}/master-snapshot.tar.bz2"
        dest: "/var/lib/mariadb_master_snapshot/{{ ansible_facts.date_time.iso8601_basic_short }}"
        owner: mysql
        group: mysql
        remote_src: true
      when:
        - mysql_repl_role == 'slave'

    - name: remove the snapshot archive on slave
      become: true
      ansible.builtin.file:
        path: "{{ mariadb_resync_dir }}/master-snapshot.tar.bz2"
        state: absent
      when:
        - mysql_repl_role == 'slave'

    - name: prepare snapshot before restore on slave
      become: true
      ansible.builtin.command:
        cmd: mariabackup --prepare --target-dir "/var/lib/mariadb_master_snapshot/{{ ansible_facts.date_time.iso8601_basic_short }}"
      when:
        - mysql_repl_role == 'slave'

    - name: restore snapshot on slave
      become: true
      ansible.builtin.command:
        cmd: mariabackup --copy-back --target-dir "/var/lib/mariadb_master_snapshot/{{ ansible_facts.date_time.iso8601_basic_short }}"
      when:
        - mysql_repl_role == 'slave'

    - name:  fix datadir owner recurse
      become: true
      ansible.builtin.file:
        path: "{{ mariadb_datadir }}"
        state: directory
        owner: mysql
        group: mysql
        recurse: true
      when:
        - mysql_repl_role == 'slave'

    - name:  fix datadir mode
      become: true
      ansible.builtin.file:
        path: "{{ mariadb_datadir }}"
        state: directory
        owner: mysql
        group: mysql
        mode: "0755"
      when:
        - mysql_repl_role == 'slave'

    - name: get the binlog file name
      become: true
      ansible.builtin.shell:
        cmd: cat xtrabackup_binlog_info | awk '{print $1}'
        chdir: "/var/lib/mariadb_master_snapshot/{{ ansible_facts.date_time.iso8601_basic_short }}"
      register: mysql_binlog_file
      when:
        - mysql_repl_role == 'slave'

    - name: get the binlog position
      become: true
      ansible.builtin.shell:
        cmd: cat xtrabackup_binlog_info | awk '{print $2}'
        chdir: "/var/lib/mariadb_master_snapshot/{{ ansible_facts.date_time.iso8601_basic_short }}"
      register: mysql_binlog_position
      when:
        - mysql_repl_role == 'slave'

    - name: start mysql on the replica
      become: true
      ansible.builtin.systemd_service:
         name: mariadb
         state: started
      when:
        - mysql_repl_role == 'slave'

    - name: Configure replication on the replica
      community.mysql.mysql_replication:
        mode: "{{ changeprimary | default('changeprimary') }}"
        master_host: "{{ mysql_repl_master }}"
        master_user: "{{ mysql_repl_creds.username }}"
        master_password: "{{ mysql_repl_creds.password }}"
        login_unix_socket: "{{ mariadb_unix_socket }}"
        master_log_file: "{{ mysql_binlog_file.stdout }}"
        master_log_pos: "{{ mysql_binlog_position.stdout }}"
        master_ssl: true
        # check the master's cert (CN = master hostname, signed by our CA).
        # Only set on a resync; existing slaves keep their current setting.
        primary_ssl_verify_server_cert: true
        master_ssl_ca: /etc/ssl/eqpress/root_CA.pem
        master_ssl_cert: "/etc/ssl/eqpress/{{ inventory_hostname }}.pem"
        master_ssl_key: "/etc/ssl/eqpress/{{ inventory_hostname }}.key"
      when:
        - mysql_repl_role == 'slave'
      no_log: true

  when:
    - mysql_repl_role is defined
    - sync_replica is defined
    - sync_replica
  tags:
    - mysql
    - mysql_resync

# Always run start slave on slave
- name: Start slave
  become: true
  community.mysql.mysql_replication:
    mode: "{{ startreplica | default('startreplica') }}"
  when:
    - mysql_repl_role is defined
    - mysql_repl_role == 'slave'
  tags:
    - mysql
    - mysql_resync
