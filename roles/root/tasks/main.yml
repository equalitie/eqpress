---
- name: Create eqpress directories
  become: true
  ansible.builtin.file:
    path: "{{ eqpress_root_dir }}/{{ item.dir }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { dir: '', owner: 'root', group: 'root', mode: '0755' }
    - { dir: '.sessions', owner: '{{ web_user }}', group: '{{ web_groupname }}', mode: '0770' }
    - { dir: 'api', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'api/commands', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'catchall', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'webstats', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'console', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'console/password', owner: 'root', group: '{{ web_groupname }}', mode: '0770' }
    - { dir: 'console/lockdown', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'console/lockdown/lock', owner: 'root', group: '{{ web_groupname }}', mode: '0770' }
    - { dir: 'console/lockdown/unlock', owner: 'root', group: '{{ web_groupname }}', mode: '0770' }
    - { dir: 'console/perms', owner: 'root', group: '{{ web_groupname }}', mode: '0770' }
    - { dir: 'console/log', owner: 'root', group: '{{ web_groupname }}', mode: '0770' }
    - { dir: 'console/proxy', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'console/plugin', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'console/plugin/eqpress-console', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'console/plugin/eqpress-console/css', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'console/plugin/eqpress-console/img', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'console/plugin/eqpress-console/inc', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'console/plugin/eqpress-console/js', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'perf', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'cache-purge', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'cache-purge/nginx-helper', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'mrtg' , owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'adminer', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'adminer/adminer-plugins', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'shared', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'shared/mu-plugins', owner: 'root', group: 'root', mode: '0755' }
  tags:
    - eqpress_root
    - console_plugin
    - adminer

- name: Install webstats page
  become: true
  ansible.builtin.template:
    src: webstats/index.php.j2
    dest: "{{ eqpress_root_dir }}/webstats/index.php"
    owner: root
    # holds the webstats DB password: readable by PHP (web user) only
    group: "{{ web_groupname }}"
    mode: "0640"
  tags:
    - eqpress_root

- name: Install console plugin files
  become: true
  ansible.builtin.copy:
    src: "console/{{ item }}"
    dest: "{{ eqpress_root_dir }}/console/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - plugin/eqpress-console/eqpress-console.php
    - plugin/eqpress-console/css/style.css
    - plugin/eqpress-console/img/eqpress-bolt.png
    - plugin/eqpress-console/img/eqpress_icon.png
    - plugin/eqpress-console/img/eqpress-logo.png
    - plugin/eqpress-console/inc/class-curl-request.php
# TODO -- this is same file that is in /usr/local/sbin . We should probably link class-http-log-parser.php
    - plugin/eqpress-console/inc/class-http-log-parser.php
    - plugin/eqpress-console/js/countdown-int.js
    - plugin/eqpress-console/js/countdown.js
  tags:
    - eqpress_root
    - console_plugin

- name: Install console templates
  become: true
  ansible.builtin.template:
    src: "console/{{ item.file }}.j2"
    dest: "{{ eqpress_root_dir }}/console/{{ item.file }}"
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { file: plugin/eqpress.php, group: root, mode: "0644" }
    - { file: plugin/eqpress-console/inc/eqpress-console-text.php, group: root, mode: "0644" }
    # the proxy holds the webstats DB password: readable by PHP (web user) only
    - { file: proxy/eqpress-console-proxy.php, group: "{{ web_groupname }}", mode: "0640" }
  loop_control:
    label: "{{ item.file }}"
  tags:
    - eqpress_root
    - console_plugin

- name: Install catchall page
  become: true
  ansible.builtin.template:
    src: "catchall/{{ item }}.j2"
    dest: "{{ eqpress_root_dir }}/catchall/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - index.html
  tags:
    - eqpress_root

- name: Install perf files
  become: true
  ansible.builtin.copy:
    src: "perf/{{ item }}"
    dest: "{{ eqpress_root_dir }}/perf/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - opcache.php
  tags:
    - eqpress_root

- name: Install cache-purge plugin files
  become: true
  ansible.builtin.copy:
    src: "cache-purge/{{ item }}"
    dest: "{{ eqpress_root_dir }}/cache-purge/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - nginx-helper.php
    - nginx-helper/purger.php
  tags:
    - eqpress_root
    - console_plugin

- name: Remove old Adminer files (pre 5.2)
  become: true
  ansible.builtin.file:
    path: "{{ eqpress_root_dir }}/adminer/{{ item }}"
    state: absent
  loop:
    - plugins
    - adminer.css
  tags:
    - eqpress_root
    - adminer

# Read-only: tell the admin when a newer Adminer release exists, so the pin
# in defaults/main.yml gets bumped. Skipped quietly if GitHub is unreachable.
- name: Check for a newer Adminer release
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.uri:
    url: https://api.github.com/repos/vrana/adminer/releases/latest
    return_content: true
    timeout: 10
  register: adminer_latest
  failed_when: false
  changed_when: false
  check_mode: false
  tags:
    - eqpress_root
    - adminer

- name: Report newer Adminer release
  ansible.builtin.debug:
    msg: >-
      NEW ADMINER RELEASE {{ adminer_latest.json.tag_name }} available
      (pinned {{ adminer_version }}). Update adminer_version and checksums in
      roles/root/defaults/main.yml.
  run_once: true
  when:
    - adminer_latest.status | default(0) == 200
    - adminer_latest.json.tag_name | default('') | length > 0
    - adminer_latest.json.tag_name | regex_replace('^v', '') != adminer_version
  tags:
    - eqpress_root
    - adminer

- name: Install Adminer
  become: true
  ansible.builtin.get_url:
    url: "{{ adminer_download }}"
    checksum: "sha256:{{ adminer_sha256 }}"
    dest: "{{ eqpress_root_dir }}/adminer/adminer.php"
    owner: root
    group: root
    mode: "0644"
  tags:
    - eqpress_root
    - adminer

- name: Install Adminer plugins
  become: true
  ansible.builtin.get_url:
    url: "{{ adminer_plugins_url }}/{{ item.file }}"
    checksum: "sha256:{{ item.sha256 }}"
    dest: "{{ eqpress_root_dir }}/adminer/adminer-plugins/{{ item.file }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ adminer_plugins }}"
  loop_control:
    label: "{{ item.file }}"
  tags:
    - eqpress_root
    - adminer

# Earlier versions saved the dark switcher plugin under a misspelled name
- name: Remove misspelled Adminer plugin file
  become: true
  ansible.builtin.file:
    path: "{{ eqpress_root_dir }}/adminer/adminer-plugins/dark-swtcher.php"
    state: absent
  tags:
    - eqpress_root
    - adminer

- name: Install Adminer plugin config
  become: true
  ansible.builtin.copy:
    src: adminer/adminer-plugins.php
    dest: "{{ eqpress_root_dir }}/adminer/adminer-plugins.php"
    owner: root
    group: root
    mode: "0644"
  tags:
    - eqpress_root
    - adminer

- name: Install Adminer index
  become: true
  ansible.builtin.copy:
    src: adminer/index.php
    dest: "{{ eqpress_root_dir }}/adminer/index.php"
    owner: root
    group: root
    mode: "0644"
  tags:
    - eqpress_root
    - adminer
