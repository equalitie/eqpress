---
- name: install packages
  become: true
  ansible.builtin.apt:
    name:
      - mariadb-server
      - mariadb-backup
      - python3-pymysql
    state: present
  tags:
    - mysql

- name: add ssl-cert groups
  become: true
  ansible.builtin.user:
    name: "{{ item }}"
    groups: ssl-cert
    append: true
    create_home: false
  loop:
    - mysql
    - "{{ ansible_facts.user_id }}"
  tags:
    - mysql

- name: global MariaDB configuration
  become: true
  ansible.builtin.template:
    src: etc/mysql/mariadb.cnf.j2
    dest: "{{ mariadb_config_file }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - "restart mariadb"
  tags:
    - mysql
    - mysql_cnf

- name: Create datadir if it does not exist
  become: true
  ansible.builtin.file:
    path: "{{ mariadb_datadir }}"
    state: directory
    owner: mysql
    group: mysql
    mode: "0755"
  tags:
    - mysql

- name: Create log if it does not exist
  become: true
  ansible.builtin.file:
    path: "{{ mariadb_logdir }}"
    state: directory
    owner: mysql
    group: mysql
    mode: "0755"
  tags:
    - mysql

- name: make sure is started and enabled on boot
  become: true
  ansible.builtin.systemd_service:
    name: mariadb
    state: started
    enabled: true
  tags:
    - mysql

- name: add override mariadb systemd directory
  become: true
  ansible.builtin.file:
    path: "{{ mariadb_systemd_override_dir }}"
    owner: root
    group: root
    mode: '0755'
    state: directory
  notify:
    - systemd_daemon_reload
    - "restart mariadb"
  tags:
    - mysql

- name: mariadb systemd overrides
  become: true
  ansible.builtin.template:
    src: "etc/systemd/system/mariadb.service.d/{{ item }}.j2"
    dest: "{{ mariadb_systemd_override_dir }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
    backup: false
  loop:
    - limits.conf
    - execstartpost.conf
  notify:
    - systemd_daemon_reload
    - "restart mariadb"
  tags:
    - mysql

- name: restart MariaDB if needed
  ansible.builtin.meta: flush_handlers
  tags:
    - mysql

- name: check if root .my.cnf exists
  become: true
  ansible.builtin.stat:
    path: /root/.my.cnf
  register: my_cnf
  tags:
    - mysql

- name: Update mysql root password when no .my.cnf
  block:

    - name: Update mysql root password for all existing hosts no .my.cnf
      become: true
      community.mysql.mysql_user:
        login_user: root
        name: root
        login_unix_socket: "{{ mariadb_unix_socket }}"
        host_all: true
        check_implicit_admin: true
      no_log: true

    - name: Update mysql root password for all root accounts no .my.cnf
      become: true
      community.mysql.mysql_user:
        login_user: root
        login_password: "{{ mysql_root_db_pass }}"
        name: root
        host: "{{ item }}"
        password: "{{ mysql_root_db_pass }}"
        login_unix_socket: "{{ mariadb_unix_socket }}"
        state: present
      loop:
        - "{{ ansible_facts.hostname }}"
        - "{{ inventory_hostname }}"
        - 127.0.0.1
        - ::1
        - localhost
      no_log: true

  when: not my_cnf.stat.exists
  tags:
    - mysql

- name: Update mysql root password when yes .my.cnf
  block:

    - name: Update mysql root password for all root accounts yes .my.cnf when localhost no
      become: true
      community.mysql.mysql_user:
        name: root
        host: "{{ item }}"
        password: "{{ mysql_root_db_pass }}"
        login_unix_socket: "{{ mariadb_unix_socket }}"
        state: present
      loop:
        - "{{ inventory_hostname }}"
        - 127.0.0.1
        - ::1
        - "{{ ansible_facts.hostname }}"
        - localhost
      when: ansible_facts.hostname != "localhost"
      no_log: true

    - name: Update mysql root password for all root accounts yes .my.cnf when localhost yes
      become: true
      community.mysql.mysql_user:
        name: root
        host: "{{ item }}"
        password: "{{ mysql_root_db_pass }}"
        login_unix_socket: "{{ mariadb_unix_socket }}"
        state: present
      loop:
        - "{{ inventory_hostname }}"
        - 127.0.0.1
        - ::1
        - localhost
      when: ansible_facts.hostname == "localhost"
      no_log: true

  when: my_cnf.stat.exists
  tags:
    - mysql

- name: .my.cnf to users home
  become: true
  # holds the root password: report a change, never print the content
  diff: false
  ansible.builtin.template:
    src: users/.my.cnf.j2
    dest: "{{ item.dir }}/.my.cnf"
    mode: "0600"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
  loop:
    - { dir: '/root', owner: 'root', group: 'root' }
    - { dir: '{{ ansible_facts.user_dir }}', owner: '{{ ansible_facts.user_id }}', group: '{{ ansible_facts.user_gid }}' }
  tags:
    - mysql

- name: ensure anonymous users are not in the database
  become: true
  community.mysql.mysql_user:
    name: ''
    host: "{{ item }}"
    state: absent
    login_unix_socket: "{{ mariadb_unix_socket }}"
  loop:
    - localhost
    - "{{ inventory_hostname }}"
  tags:
    - mysql

- name: remove the test database
  become: true
  community.mysql.mysql_db:
    name: test
    state: absent
    login_unix_socket: "{{ mariadb_unix_socket }}"
  tags:
    - mysql

- name: Create webstats user
  become: true
  community.mysql.mysql_user:
    name: "{{ mysql_webstats.username }}"
    host: localhost
    password: "{{ mysql_webstats.password }}"
    # webstats.php, webstats_totals.php, webstats/index.php and the console
    # proxy only read and add rows in the webstats DB
    priv: "{{ mysql_webstats.db }}.*:SELECT,INSERT"
    state: present
    login_unix_socket: "{{ mariadb_unix_socket }}"
  when:
    - mysql_repl_role is defined
    - mysql_repl_role == 'master'
  no_log: true
  tags:
    - mysql

- name: Create webstats DB
  become: true
  community.mysql.mysql_db:
    name: "{{ mysql_webstats.db }}"
    state: present
    login_unix_socket: "{{ mariadb_unix_socket }}"
  when:
    - mysql_repl_role is defined
    - mysql_repl_role == 'master'
  register: web_stats_db
  tags:
    - mysql

# Only when the DB was just created: copy the table layout, import it and
# remove the copy, so normal runs do not touch /tmp
- name: Create webstats tables
  become: true
  block:
    - name: Copy webstats DB table structure to server
      ansible.builtin.copy:
        src: etc/mysql/webstats.sql
        dest: /tmp/webstats.sql
        mode: "0600"

    - name: Import webstats tables
      community.mysql.mysql_db:
        name: "{{ mysql_webstats.db }}"
        state: import
        target: /tmp/webstats.sql
        login_unix_socket: "{{ mariadb_unix_socket }}"
  always:
    - name: Remove the webstats table structure copy
      ansible.builtin.file:
        path: /tmp/webstats.sql
        state: absent
  when:
    - mysql_repl_role is defined
    - mysql_repl_role == 'master'
    - web_stats_db is defined
    - web_stats_db.changed
  tags:
    - mysql

- name: Create the mysql monitoring for telegraf
  become: true
  community.mysql.mysql_user:
    name: "{{ mysql_telegraf_user.username }}"
    host: "{{ item }}"
    password: "{{ mysql_telegraf_user.password }}"
    # Read-only monitoring: process list, binlog and slave status, table
    # sizes and columns (SHOW VIEW, REFERENCES make them visible without
    # reading data), performance_schema. Same metrics as ALL (tested).
    priv: "*.*:PROCESS,REFERENCES,SHOW VIEW,BINLOG MONITOR,SLAVE MONITOR/performance_schema.*:SELECT"
    column_case_sensitive: true
    state: present
    login_unix_socket: "{{ mariadb_unix_socket }}"
  loop:
    - localhost
  when:
    - (mysql_repl_role is defined and mysql_repl_role == 'master') or (auto_provision_host is defined and auto_provision_host)
    - enable_telegraf is defined and enable_telegraf
    - mysql_telegraf_user is defined
  tags:
    - mysql
    - telegraf
