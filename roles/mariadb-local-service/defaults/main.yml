---
mariadb_config_file: /etc/mysql/mariadb.cnf
mariadb_datadir: /var/lib/mysql
mariadb_unix_socket: /run/mysqld/mysqld.sock
mariadb_logdir: /var/log/mysql
mariadb_port: "3306"
mariadb_systemd_override_dir: "/etc/systemd/system/mariadb.service.d"
mariadb_systemd_override_nofile: "350000"
mariadb_systemd_override_memlock: "350000"
mariadb_max_connections: "250"
# Compress binlog events (the slave reads them as is). About 2x smaller for
# normal site traffic, 3x for database imports, so mysql_expire_logs_seconds
# can be raised. Set to false in group_vars to turn it off for a cluster.
mariadb_log_bin_compress: true
# performance_schema: on for press nodes (telegraf wait/lock/statement
# metrics), off on the provision server. Set false in group_vars to turn off.
mariadb_performance_schema: "{{ not (auto_provision_host | default(false) | bool) }}"
