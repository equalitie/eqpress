---
- name: Check mail_service names an existing Postfix config
  ansible.builtin.assert:
    that:
      - mail_service in ['eqpress', 'mandrill', 'sendgrid']
    fail_msg: "mail_service is '{{ mail_service | default('') }}'; it must be eqpress, mandrill or sendgrid (main.cf would point at a missing file)."
    quiet: true
  tags:
    - postfix

- name: Install Postfix and mail tools
  become: true
  ansible.builtin.apt:
    name:
      # clamav: not used by Postfix; admins run clamscan by hand on sites
      - clamav
      - mailutils
      - libsasl2-modules
      - postfix
    state: present
  tags:
    - postfix

- name: Install Postfix main.cf variants
  become: true
  ansible.builtin.template:
    src: "etc/postfix/{{ item }}.j2"
    dest: "/etc/postfix/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - main.cf-eqpress
    - main.cf-mandrill
    - main.cf-sendgrid
  tags:
    - postfix
  notify:
    - "restart postfix"

- name: Check /etc/postfix/main.cf
  become: true
  ansible.builtin.stat:
    path: /etc/postfix/main.cf
  register: postfix_main_cf
  tags:
    - postfix

- name: Keep the distribution main.cf as main.cf.dist
  become: true
  ansible.builtin.command:
    cmd: mv /etc/postfix/main.cf /etc/postfix/main.cf.dist
    creates: /etc/postfix/main.cf.dist
  when:
    - postfix_main_cf.stat.islnk is defined
    - not postfix_main_cf.stat.islnk
  tags:
    - postfix
  notify:
    - "restart postfix"

- name: Link main.cf to the selected mail service
  become: true
  ansible.builtin.file:
    src: "/etc/postfix/main.cf-{{ mail_service }}"
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    state: link
    force: true
  tags:
    - postfix
  notify:
    - "restart postfix"

# Relay logins live in a root-only map, not in the world-readable main.cf
# (after main.cf exists: postmap refuses to run without it).
# (main.cf must stay readable: PHP mail() runs sendmail as the web user).
- name: Install SMTP relay logins
  become: true
  ansible.builtin.template:
    src: etc/postfix/sasl_passwd.j2
    dest: /etc/postfix/sasl_passwd
    owner: root
    group: root
    mode: "0600"
  register: postfix_sasl_passwd
  tags:
    - postfix
  notify:
    - "restart postfix"

- name: Check for the relay login map database
  become: true
  ansible.builtin.stat:
    path: /etc/postfix/sasl_passwd.db
  register: postfix_sasl_db
  tags:
    - postfix

- name: Build the relay login map database
  become: true
  ansible.builtin.command:
    argv: [postmap, "hash:/etc/postfix/sasl_passwd"]
  when: postfix_sasl_passwd is changed or not postfix_sasl_db.stat.exists
  tags:
    - postfix
  notify:
    - "restart postfix"

- name: Keep the relay login map database root only
  become: true
  ansible.builtin.file:
    path: /etc/postfix/sasl_passwd.db
    owner: root
    group: root
    mode: "0600"
  tags:
    - postfix
