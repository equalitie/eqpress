---
- name: Install common packages
  become: yes
  ansible.builtin.apt:
    name:
      - clamav
      - mailutils 
      - libsasl2-modules
      - postfix
    state: present
  tags:
    - postfix

- name: template postfix mail.cf
  become: yes
  ansible.builtin.template:
    src: "etc/postfix/{{ item }}.j2"
    dest: "/etc/postfix/{{ item }}"
    owner: root
    group: root
    mode: 0644
  loop:
   - main.cf-eqpress
   - main.cf-mandrill
   - main.cf-sendgrid
  tags:
    - postfix
  notify:
    - "restart postfix"

- name: stat /etc/postfix/main.cf
  become: yes
  ansible.builtin.stat:
    path: /etc/postfix/main.cf
  register: postfix_main_cf
  tags:
    - postfix

- name: move default main.cf if exists and not symlink
  become: yes
  ansible.builtin.command:
    cmd: mv /etc/postfix/main.cf /etc/postfix/main.cf.dist
    creates: /etc/postfix/main.cf.dist
  when:
    - postfix_main_cf.stat.islnk is defined
    - not postfix_main_cf.stat.islnk
  tags:
    - postfix
  notify:
    - "restart postfix"

- name: Symlink to postfix mail.cf
  become: yes
  ansible.builtin.file:
    src: "/etc/postfix/main.cf-{{ mail_service }}"
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    state: link
    force: yes
  tags:
    - postfix
  notify:
    - "restart postfix"

# Relay logins live in a root-only map, not in the world-readable main.cf
# (after main.cf exists: postmap refuses to run without it).
# (main.cf must stay readable: PHP mail() runs sendmail as the web user).
- name: Install SMTP relay logins
  become: true
  ansible.builtin.template:
    src: etc/postfix/sasl_passwd.j2
    dest: /etc/postfix/sasl_passwd
    owner: root
    group: root
    mode: "0600"
  register: postfix_sasl_passwd
  tags:
    - postfix
  notify:
    - "restart postfix"

- name: Check for the relay login map database
  become: true
  ansible.builtin.stat:
    path: /etc/postfix/sasl_passwd.db
  register: postfix_sasl_db
  tags:
    - postfix

- name: Build the relay login map database
  become: true
  ansible.builtin.command:
    argv: [postmap, "hash:/etc/postfix/sasl_passwd"]
  when: postfix_sasl_passwd is changed or not postfix_sasl_db.stat.exists
  tags:
    - postfix
  notify:
    - "restart postfix"

- name: Keep the relay login map database root only
  become: true
  ansible.builtin.file:
    path: /etc/postfix/sasl_passwd.db
    owner: root
    group: root
    mode: "0600"
  tags:
    - postfix
