---
# Servers set up before 2024-07 used apt_repository with NodeSource 20.x
# (deb_nodesource_com_node_<ver>.list, older key). Remove those leftovers;
# an entry for the same repo with another key makes apt fail.
- name: find old NodeSource apt sources
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "deb_nodesource_com_node_*.list"
  register: old_nodesource_lists
  tags:
    - provision
    - rampass
    - nodejs

- name: remove old NodeSource apt sources
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ old_nodesource_lists.files }}"
  loop_control:
    label: "{{ item.path }}"
  tags:
    - provision
    - rampass
    - nodejs

- name: install nodejs repo
  become: true
  ansible.builtin.deb822_repository:
    name: nodejs
    types: deb
    uris: "{{ nodejs_repo }}"
    suites: nodistro
    components: main
    signed_by: "{{ nodejs_gpg_key_url }}"
  tags:
    - provision
    - rampass
    - nodejs

# latest: moves old servers off Node 20 and keeps Node 22 patched
- name: install Node.js
  become: true
  ansible.builtin.apt:
    name: nodejs
    state: latest
    update_cache: true
  tags:
    - provision
    - rampass
    - nodejs

- name: install composer
  become: true
  ansible.builtin.apt:
    name: composer
    state: present
  tags:
    - provision
    - rampass
    - composer

- name: create rampass user
  become: true
  ansible.builtin.user:
    name: rampass
    create_home: true
    group: "{{ web_groupname }}"
    password: '!'
    shell: /usr/sbin/nologin
    home: "{{ eqpress_base_dir }}/rampass"
  tags:
    - provision
    - rampass

# TODO: For now use pwpusher vars for mysql user/database
# ep_pwpusher_db:
# ep_pwpusher_user:
# ep_pwpusher_pw:

- name: create rampass mysql database
  become: true
  mysql_db:
    name: "{{ eq_pwpusher_db }}"
    state: present
    login_unix_socket: "{{ mariadb_unix_socket }}"
  tags:
    - provision
    - rampass

- name: create rampass mysql users
  become: true
  mysql_user:
    name: "{{ eq_pwpusher_user }}"
    host: localhost
    password: "{{ eq_pwpusher_pw }}"
    priv: "{{ eq_pwpusher_db }}.*:ALL"
    state: present
    login_unix_socket: "{{ mariadb_unix_socket }}"
  no_log: true
  tags:
    - provision
    - rampass

- name: rampass directory to owner rampass
  become: true
  ansible.builtin.file:
    state: directory
    path: "{{ eqpress_base_dir }}/rampass"
    owner: rampass
    group: "{{ web_groupname }}"
    recurse: true
  tags:
    - provision
    - rampass

- name: clone rampass
  become: true
  become_user: rampass
  ansible.builtin.git:
    repo: "{{ rampass_repo }}"
    dest: "{{ eqpress_base_dir }}/rampass/rampass"
    bare: false
    version: "{{ rampass_version }}"
    force: true
    accept_hostkey: true
  tags:
    - provision
    - rampass

# Note: We do not want to overwrite because we have salt key in here
- name: .env install from template [do not overwrite]
  become: true
  ansible.builtin.template:
    src: rampass/env.j2
    dest: "{{ eqpress_base_dir }}/rampass/rampass/.env"
    owner: rampass
    group: "{{ web_groupname }}"
    mode: "0640"
    force: false
  tags:
    - provision
    - rampass

- name: run composer update
  become: true
  become_user: rampass
  community.general.composer:
    command: "update"
    working_dir: "{{ eqpress_base_dir }}/rampass/rampass"
    executable: "/usr/bin/php{{ php_version }}"
  tags:
    - provision
    - rampass
    - composer

# rampass (Vite 8) needs Node.js 22.12 or newer to build
- name: check Node.js version
  ansible.builtin.command: node --version
  register: rampass_node_version
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - provision
    - rampass
    - nodejs

- name: stop if Node.js is too old for rampass
  ansible.builtin.assert:
    that:
      - rampass_node_version.rc == 0
      - rampass_node_version.stdout | regex_replace('^v', '') is version('22.12.0', '>=')
    fail_msg: >-
      Node.js {{ rampass_node_version.stdout | default('') or 'not found' }} is too old or missing for rampass (needs 22.12+).
      Check that the NodeSource repo ({{ nodejs_repo }}) is used: apt-cache policy nodejs
    quiet: true
  # in --check, a new server has no Node.js yet (its install is only simulated)
  when: not (ansible_check_mode and rampass_node_version.rc != 0)
  tags:
    - provision
    - rampass
    - nodejs

- name: run command for new install
  become: true
  become_user: rampass
  ansible.builtin.command:
    cmd: "{{ item }}"
  args:
    chdir: "{{ eqpress_base_dir }}/rampass/rampass"
  loop:
    - "npm install"
    - "npm run build"
    - "php artisan key:generate -n"
    - "php artisan salt:generate -n"
    - "php artisan storage:link"
    - "php artisan migrate --force"
  tags:
    - provision
    - rampass

- name: secure rampass directory
  become: true
  ansible.builtin.file:
    state: directory
    path: "{{ eqpress_base_dir }}/rampass/{{ item.name }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    recurse: "{{ item.recurse }}"
  loop:
    - { name: "rampass", owner: "rampass", group: "{{ web_groupname }}", recurse: no }
    - { name: "rampass/storage", owner: "{{ web_user }}", group: "{{ web_groupname }}", recurse: yes }
  tags:
    - provision
    - rampass

- name: fix .env owner
  become: true
  ansible.builtin.file:
    path: "{{ eqpress_base_dir }}/rampass/rampass/.env"
    mode: "0640"
    owner: rampass
    group: "{{ web_groupname }}"
    state: touch
  tags:
    - provision
    - rampass

- name: nginx sites-available for rampass
  become: true
  ansible.builtin.template:
    src: rampass/nginx-rampass.conf.j2
    dest: /etc/nginx/sites-available/rampass.conf
    owner: root
    group: root
    mode: "0644"
    force: true
  notify:
    - reload_nginx
  tags:
    - provision
    - rampass

- name: nginx sites-enabled for rampass
  become: true
  ansible.builtin.file:
    src: /etc/nginx/sites-available/rampass.conf
    dest: /etc/nginx/sites-enabled/rampass.conf
    owner: root
    group: root
    state: link
  notify:
    - reload_nginx
  tags:
    - provision
    - rampass
