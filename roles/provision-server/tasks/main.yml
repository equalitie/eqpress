---
- name: create provision directories
  become: true
  ansible.builtin.file:
    path: "{{ eqpress_root_dir }}/{{ item.dir }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { dir: '', owner: 'root', group: 'root', mode: '0755' }
    - { dir: '.sessions', owner: '{{ web_user }}', group: '{{ web_groupname }}', mode: '0770' }
    - { dir: 'catchall', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'provision', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'ansible', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'provision/includes', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'provision/pending', owner: 'root', group: '{{ web_groupname }}', mode: '0775' }
    - { dir: 'provision/processing', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'provision/processed', owner: 'root', group: 'root', mode: '0755' }
    - { dir: 'provision/templates', owner: 'root', group: 'root', mode: '0755' }
  tags:
    - provision
    - provision_dir
    - ansible_inventory

- name: catchall templates
  become: true
  ansible.builtin.template:
    src: "catchall/{{ item }}.j2"
    dest: "{{ eqpress_root_dir }}/catchall/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - index.html
  tags:
    - provision

- name: create a webserver writable "{{ auto_provision_log_file }}"
  become: true
  ansible.builtin.file:
    path: "{{ eqpress_root_dir }}/provision/{{ auto_provision_log_file }}"
    mode: "0600"
    owner: "{{ web_user }}"
    group: "{{ web_groupname }}"
    state: touch
  tags:
    - provision

- name: copy provision scripts
  become: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ eqpress_root_dir }}/{{ item }}"
    mode: "0644"
    owner: root
    group: root
  loop:
    - provision/install.css
    - provision/includes/class-curl-request.php
    - provision/includes/class-ep-provision-view.php
  tags:
    - provision_files
    - provision

- name: install main provision code from template
  become: true
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ eqpress_root_dir }}/{{ item }}"
    mode: "0644"
    owner: root
    group: root
  loop:
    - provision/provision.php
    - provision/includes/class-provision-util.php
    - provision/templates/nginx-config.mustache
    - provision/templates/wp-config.php.mustache
    - provision/templates/welcome-email.txt.mustache
    - provision/templates/provision.yml.mustache
  tags:
    - provision
    - provision_template

# The keyserver is often down: it is only contacted when the key is missing
# or expires within provision_gpg_refresh_days. A missing/expiring key is a
# warning (monit_provision.sh keeps unencrypted archives root-only and
# emails); a wrong or ambiguous key in root's keyring fails the play.
- name: Check auto-provision GPG key (fetch only if missing or expiring)
  become: true
  ansible.builtin.script:
    cmd: >-
      eq_provision_gpg_key.sh {{ auto_provision_gpg_id | quote }}
      {{ provision_gpg_keyserver | quote }} {{ provision_gpg_refresh_days | int }}
    executable: /bin/bash
  environment:
    GNUPGHOME: /root/.gnupg
  register: provision_gpg_key
  changed_when: provision_gpg_key.rc == 10
  failed_when: provision_gpg_key.rc not in [0, 10, 20]
  tags:
    - provision_gpg
    - provision

- name: Warn about the auto-provision GPG key
  ansible.builtin.debug:
    msg: "{{ provision_gpg_key.stdout_lines }}"
  # the script is skipped in --check, so there is no rc then
  when: provision_gpg_key.rc | default(0) == 20
  tags:
    - provision_gpg
    - provision

- name: install ansible
  become: true
  ansible.builtin.apt:
    name: ansible
    state: present
  tags:
    - provision

- ansible.builtin.include_tasks: install-mustache.yml
  tags: always

- ansible.builtin.include_tasks: install-rampass.yml
  tags: always

- name: get some variables set from json string of nodes
  ansible.builtin.set_fact:
    auto_provision_nodes_input: "{{ auto_provision_nodes | from_json }}"
  tags:
    - provision
    - ansible_inventory

- name: install ansible_inventory
  become: true
  ansible.builtin.template:
    dest: "{{ eqpress_root_dir }}/ansible/hosts"
    src: etc/ansible/hosts.j2
    mode: "0640"
    owner: root
    group: root
  tags:
    - provision
    - ansible_inventory

# /home/wordpress/latest.tar.gz is the WordPress every new site gets.
# wordpress_source_version (defaults/main.yml):
#   "latest"  - follow wordpress.org/latest (replaced only when it changed)
#   "6.8.3"   - pin that release (e.g. to go back when latest is bad)
#   "manual"  - never download; keep the file that is there
- name: Check wordpress_source_version
  ansible.builtin.assert:
    that:
      - wordpress_source_version is match('^(latest|manual|[0-9]+(\.[0-9]+)+)$')
    fail_msg: >-
      wordpress_source_version must be "latest", "manual" or a release number
      such as "6.8.3", not "{{ wordpress_source_version }}"
    quiet: true
  tags:
    - provision
    - wordpress_source

- name: Create /home/wordpress for the WordPress archive
  become: true
  ansible.builtin.file:
    path: /home/wordpress
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - provision
    - wordpress_source

- name: Install WordPress {{ wordpress_source_version }} as /home/wordpress/latest.tar.gz
  become: true
  vars:
    wp_archive: "{{ (wordpress_source_version == 'latest') | ternary('latest', 'wordpress-' ~ wordpress_source_version) }}.tar.gz"
  ansible.builtin.get_url:
    url: "https://wordpress.org/{{ wp_archive }}"
    checksum: "sha1:https://wordpress.org/{{ wp_archive }}.sha1"
    dest: /home/wordpress/latest.tar.gz
    owner: root
    group: root
    mode: "0644"
  when: wordpress_source_version != 'manual'
  tags:
    - provision
    - wordpress_source
