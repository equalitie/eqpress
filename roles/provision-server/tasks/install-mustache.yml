---

- name: clone the mustache repository
  become: true
  ansible.builtin.git:
    repo: https://github.com/bobthecow/mustache.php.git
    dest: "{{ eqpress_root_dir }}/provision/includes/mustache"
    recursive: true
    version: "{{ mustache_version }}"
    accept_hostkey: true
  tags:
    - provision
