---
- name: remount
  become: true
  ansible.builtin.command:
    cmd: /bin/mount -a

- name: reload_nginx
  become: true
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded

- name: restart_nginx
  become: true
  ansible.builtin.systemd_service:
    name: nginx
    state: restarted
