---
- name: setup docker nginx modules
  become: yes
  ansible.builtin.template:
    src: nginx_modules.conf.j2
    dest: /etc/nginx/modules-enabled/modules.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    reload_nginx
  tags:
    - nginx
    - nginx_docker

- name: add "{{ docker_group }}" to user "{{ ansible_user_id }}"
  become: yes
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    create_home: no
    append: yes
    groups: "{{ docker_group }}"
  tags:
    - nginx
    - nginx_docker

- name: create directories
  ansible.builtin.file:
    path: "{{ item.dir }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0700"
    state: directory
  loop:
    - { dir: '{{ ansible_user_dir }}/docker', owner: '{{ ansible_user_id }}', group: '{{ ansible_user_gid }}' }
    - { dir: '{{ ansible_user_dir }}/docker/eqpress_nginx', owner: '{{ ansible_user_id }}', group: '{{ ansible_user_gid }}' }
  tags:
    - nginx
    - nginx_docker

- name: create compose.yaml for nginx
  ansible.builtin.template:
    dest: "{{ ansible_user_dir }}/docker/eqpress_nginx/compose.yaml"
    src: nginx-compose.yaml.j2
    mode: '0640'
  register: nginx_compose_file
  tags:
    - nginx
    - nginx_docker
    - nginx_docker_template

- name: create Dockerfile for nginx
  ansible.builtin.template:
    dest: "{{ ansible_user_dir }}/docker/eqpress_nginx/Dockerfile"
    src: Dockerfile.j2
    mode: '0640'
  register: nginx_dockerfile
  tags:
    - nginx
    - nginx_docker
    - nginx_docker_template

# docker compose only builds an image when none exists, so a bump of
# nginx_docker_version (or the purge module) would never reach the running
# container. Rebuild and recreate when the Dockerfile/compose file changed,
# or when the running nginx is not the wanted version (also catches a run
# that failed after writing the Dockerfile but before rebuilding).
- name: Check running nginx version in the container
  ansible.builtin.command:
    argv: [docker, exec, "{{ nginx_container_name }}", nginx, -v]
  register: nginx_running_version
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - nginx
    - nginx_docker

- name: Decide whether the nginx image must be rebuilt
  ansible.builtin.set_fact:
    nginx_needs_build: >-
      {{ nginx_dockerfile is changed
         or nginx_compose_file is changed
         or nginx_running_version.rc != 0
         or ('nginx/' ~ nginx_docker_version) not in (nginx_running_version.stderr ~ nginx_running_version.stdout) }}
  tags:
    - nginx
    - nginx_docker

- name: Report nginx rebuild
  ansible.builtin.debug:
    msg: >-
      Rebuilding nginx image and recreating the container: wanted
      nginx/{{ nginx_docker_version }}, running
      '{{ (nginx_running_version.stderr ~ nginx_running_version.stdout) | trim | default('none', true) }}'
  when: nginx_needs_build | bool
  tags:
    - nginx
    - nginx_docker

# NOTE: docker_compose_v2 is using the docker compose plugin
# ie; docker compose up (with --build when a rebuild is needed)
- name: install and bring up nginx container with docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ ansible_user_dir }}/docker/eqpress_nginx"
    state: present
    build: "{{ 'always' if nginx_needs_build | bool else 'policy' }}"
  register: docker_compose_results
  tags:
    - nginx
    - nginx_docker

- name: Verify the container runs the wanted nginx version
  ansible.builtin.command:
    argv: [docker, exec, "{{ nginx_container_name }}", nginx, -v]
  register: nginx_new_version
  changed_when: false
  check_mode: false
  failed_when: ('nginx/' ~ nginx_docker_version) not in (nginx_new_version.stderr ~ nginx_new_version.stdout)
  when: not ansible_check_mode
  tags:
    - nginx
    - nginx_docker

- name: install dockerized nginx command
  become: yes
  ansible.builtin.template:
    dest: /usr/local/sbin/docker-nginx
    src: docker-nginx.j2
    owner: root
    group: root
    mode: "0755"
  tags:
    - nginx
    - nginx_docker_script
    - nginx_docker

- name: symlink docker-nginx -> /usr/sbin/nginx
  become: yes
  ansible.builtin.file:
    src: /usr/local/sbin/docker-nginx
    dest: /usr/sbin/nginx
    owner: root
    group: root
    state: link
  tags:
    - nginx
    - nginx_docker_script
    - nginx_docker

- name: install nginx systemd service file when for dockerized nginx
  become: yes
  ansible.builtin.template:
    dest: /etc/systemd/system/nginx.service
    src: docker-nginx-systemd.j2
    owner: root
    group: root
    mode: "0644"
  register: nginx_docker_systemd_template
  tags:
    - nginx
    - nginx_docker_systemd
    - nginx_docker

- name: remove any nginx overrides
  become: yes
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: absent
  register: nginx_docker_systemd_overrides
  tags:
    - nginx
    - nginx_docker_systemd
    - nginx_docker

- name: systemd daemon reload
  become: yes
  ansible.builtin.systemd:
    daemon_reload: yes
  when: nginx_docker_systemd_template.changed|bool or nginx_docker_systemd_overrides.changed|bool
  tags:
    - nginx
    - nginx_docker_systemd
    - nginx_docker

- name: enable nginx systemd service
  become: yes
  ansible.builtin.systemd:
    name: nginx
    enabled: true
  tags:
    - nginx
    - nginx_docker_systemd
    - nginx_docker
