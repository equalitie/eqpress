---
- name: Remove /var/www/html
  become: true
  ansible.builtin.file:
    path: /var/www/html
    state: absent
  tags:
    - nginx

- name: Create {{ web_user_home }} owned by root
  become: true
  ansible.builtin.file:
    path: "{{ web_user_home }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - nginx

- name: Install nginx related packages
  become: true
  ansible.builtin.apt:
    name:
      - nginx-extras
    state: present
  when:
    - web_server_docker is not defined or web_server_docker|bool == false
  tags:
    - nginx

- name: Create default nginx directories
  become: true
  ansible.builtin.file:
    path: "/etc/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - nginx
    - nginx/sites-enabled
    - nginx/sites-available
    - nginx/modules-enabled
    - nginx/conf.d
  tags:
    - nginx

- name: Create nginx eqpress-common directory
  become: true
  ansible.builtin.file:
    path: /etc/nginx/eqpress-common
    state: directory
    mode: "0750"
    owner: root
    group: "{{ web_groupname }}"
  tags:
    - nginx

- name: Create nginx log directory
  become: true
  ansible.builtin.file:
    path: /var/log/nginx
    state: directory
    mode: "0750"
    owner: root
    group: "{{ web_groupname }}"
  tags:
    - nginx

- name: Remove default nginx site link
  become: true
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify:
    - reload_nginx
  tags:
    - nginx

- name: Create nginx cache directory for tmpfs
  become: true
  ansible.builtin.file:
    path: /var/cache/nginx
    owner: "{{ web_user }}"
    group: root
    state: directory
    mode: "0750"
  tags:
    - nginx

- name: Mount tmpfs on /var/cache/nginx
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/fstab
    regexp: "/var/cache/nginx"
    line: "tmpfs /var/cache/nginx tmpfs rw,noexec,nosuid,nodev,mode=0750,uid={{ web_user }} 0 0"
    state: present
  notify:
    - remount
  tags:
    - nginx

- name: Create nginx-ondisk cache directory
  become: true
  ansible.builtin.file:
    path: /var/cache/nginx-ondisk
    state: directory
    owner: "{{ web_user }}"
    group: root
    mode: "0750"
  tags:
    - nginx

- name: Install templated nginx common files
  become: true
  ansible.builtin.template:
    src: "etc/nginx/{{ item }}.j2"
    dest: "/etc/nginx/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - nginx.conf
    - eqpress-common/common_adminer.conf
    - eqpress-common/common_fastcgi.conf
    - eqpress-common/common_headers.conf
    - eqpress-common/common_eqpress_ssl.conf
    - eqpress-common/common_cdn_realip.conf
  notify:
    - reload_nginx
  tags:
    - nginx_config
    - nginx

- name: Install nginx common files
  become: true
  ansible.builtin.copy:
    src: "etc/nginx/{{ item }}"
    dest: "/etc/nginx/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - mime.types
    - fastcgi_params
    - eqpress-common/common_cache.conf
    - eqpress-common/common_exceptions.conf
    - eqpress-common/common_location.conf
    - eqpress-common/common_location_ep.conf
    - eqpress-common/common_log_formats.conf
    - eqpress-common/common_login_limiter.conf
    - eqpress-common/common_mobile_user_agents.conf
    - eqpress-common/common_multisite_3.5.conf
    - eqpress-common/common_w3tc.conf
    - eqpress-common/lua_block_post_noreferrer.lua
    - eqpress-common/lua_block_post_noreferrer_on.lua
    - eqpress-common/lua_block_wplogin_noreferrer.lua
  notify:
    - reload_nginx
  tags:
    - nginx_config
    - nginx

# Users for the password-protected admin pages (/webstats/, /perf/)
# in the eqpress vhost. Created empty (nobody can log in) and never
# overwritten, so users added by hand are kept:
#   htpasswd /etc/nginx/restricted_pages.htpasswd <user>   (apache2-utils)
- name: Create htpasswd file for restricted admin pages
  become: true
  ansible.builtin.copy:
    content: ""
    dest: /etc/nginx/restricted_pages.htpasswd
    owner: root
    group: "{{ web_groupname }}"
    mode: "0640"
    force: false
  when: not auto_provision_host | default(false) | bool
  tags:
    - nginx
    - nginx_config

- name: Install eqpress nginx site
  become: true
  ansible.builtin.template:
    src: etc/nginx/sites-available/eqpress.j2
    dest: /etc/nginx/sites-available/eqpress
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: not auto_provision_host | default(false) | bool
  notify:
    - reload_nginx
  tags:
    - nginx
    - nginx_config

- name: Install eqpress-provision nginx site
  become: true
  ansible.builtin.template:
    src: etc/nginx/sites-available/eqpress-provision.j2
    dest: /etc/nginx/sites-available/eqpress-provision
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: auto_provision_host | default(false) | bool
  notify:
    - reload_nginx
  tags:
    - nginx
    - nginx_config

- name: Enable eqpress-provision nginx site
  become: true
  ansible.builtin.file:
    src: /etc/nginx/sites-available/eqpress-provision
    dest: /etc/nginx/sites-enabled/eqpress-provision
    state: link
  when: auto_provision_host | default(false) | bool
  notify:
    - reload_nginx
  tags:
    - nginx
    - nginx_config

- name: Enable eqpress nginx site
  become: true
  ansible.builtin.file:
    src: /etc/nginx/sites-available/eqpress
    dest: /etc/nginx/sites-enabled/eqpress
    state: link
  when: not auto_provision_host | default(false) | bool
  notify:
    - reload_nginx
  tags:
    - nginx
    - nginx_config

- name: Install nginx logrotate config
  become: true
  ansible.builtin.copy:
    src: etc/logrotate.d/nginx
    dest: /etc/logrotate.d
    owner: root
    group: root
    mode: "0644"
  tags:
    - nginx

- name: Set nginx open file limit in /etc/default/nginx
  become: true
  ansible.builtin.copy:
    src: etc/default/nginx
    dest: /etc/default/nginx
    owner: root
    group: root
    mode: "0644"
  when:
    - web_server_docker is not defined or web_server_docker|bool == false
  notify:
    - restart_nginx
  tags:
    - nginx

- name: Set up dockerized nginx
  ansible.builtin.include_tasks: nginx-docker.yml
  when: web_server_docker|bool == true
  tags: always

- name: Enable nginx at boot
  become: true
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
  when:
    - web_server_docker is not defined or web_server_docker|bool == false
  tags:
    - nginx
