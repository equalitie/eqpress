---
# RSA is kept on purpose: backup_from_master.sh and the fetched key
# filenames expect id_rsa. Moving to ed25519 needs a planned migration.
- name: Generate SSH key for root and admin user
  become: true
  ansible.builtin.user:
    name: "{{ item }}"
    generate_ssh_key: true
    ssh_key_type: 'rsa'
  loop:
    - root
    - "{{ ansible_facts['user_id'] }}"
  tags:
    - ssh

- name: Fetch public keys to controller
  become: true
  ansible.builtin.fetch:
    src: "{{ item.path }}/.ssh/id_rsa.pub"
    dest: "../config/ssh/id_rsa_{{ item.user }}_{{ inventory_hostname }}.pub"
    flat: true
  loop:
    - { path: "/root", user: "root" }
    - { path: "{{ ansible_facts['user_dir'] }}", user: "{{ ansible_facts['user_id'] }}" }
  tags:
    - ssh

- name: Authorize slave keys on master
  become: true
  ansible.builtin.authorized_key:
    user: "{{ item.user1 }}"
    state: present
    key: "{{ lookup('file', '../config/ssh/id_rsa_' + item.user2 + '_' + mysql_repl_slave + '.pub') }}"
    # Key only works when the connection comes from the slave itself
    key_options: 'from="{{ hostvars[mysql_repl_slave].public_ipv4_address }}"'
  when:
    - mysql_repl_role is defined
    - mysql_repl_role == 'master'
    - mysql_repl_slave is defined
  loop:
    - { user1: "root", user2: "root" }
    - { user1: "root", user2: "{{ ansible_facts['user_id'] }}" }
    - { user1: "{{ ansible_facts['user_id'] }}", user2: "{{ ansible_facts['user_id'] }}" }
    - { user1: "{{ ansible_facts['user_id'] }}", user2: "root" }
  tags:
    - ssh

- name: Authorize master keys on slave
  become: true
  ansible.builtin.authorized_key:
    user: "{{ item.user1 }}"
    state: present
    key: "{{ lookup('file', '../config/ssh/id_rsa_' + item.user2 + '_' + mysql_repl_master + '.pub') }}"
    # Key only works when the connection comes from the master itself
    key_options: 'from="{{ hostvars[mysql_repl_master].public_ipv4_address }}"'
  when:
    - mysql_repl_role is defined
    - mysql_repl_role == 'slave'
    - mysql_repl_master is defined
  loop:
    - { user1: "root", user2: "root" }
    - { user1: "root", user2: "{{ ansible_facts['user_id'] }}" }
    - { user1: "{{ ansible_facts['user_id'] }}", user2: "{{ ansible_facts['user_id'] }}" }
    - { user1: "{{ ansible_facts['user_id'] }}", user2: "root" }
  tags:
    - ssh

# Prefer the partner's host key from gathered facts: Ansible read it over its
# own host-key-verified SSH connection. Fall back to ssh-keyscan (run on the
# controller, unverified) only when the partner is not in this play.
- name: Add replication partner to known_hosts
  become: true
  ansible.builtin.known_hosts:
    path: "{{ item }}/{{ ssh_known_hosts_file }}"
    name: "{{ ssh_partner }}"
    state: present
    key: >-
      {{ ssh_partner ~ ' ' ~ ssh_partner_facts['ssh_host_key_ed25519_public_keytype'] ~ ' ' ~ ssh_partner_facts['ssh_host_key_ed25519_public']
         if ssh_partner_facts['ssh_host_key_ed25519_public'] is defined
         else lookup('pipe', 'ssh-keyscan -t ed25519 ' ~ (ssh_partner | quote)) }}
    hash_host: false
  vars:
    ssh_partner: "{{ mysql_repl_slave if mysql_repl_role == 'master' else mysql_repl_master }}"
    ssh_partner_facts: "{{ hostvars[ssh_partner]['ansible_facts'] | default({}) }}"
  when:
    - mysql_repl_role | default('') in ['master', 'slave']
    - (mysql_repl_slave if mysql_repl_role == 'master' else mysql_repl_master) is defined
  loop:
    - "/root"
    - "{{ ansible_facts['user_dir'] }}"
  tags:
    - ssh
    - known_hosts

- name: Report replication partner host key source
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: partner {{ ssh_partner }} host key
      {{ 'from verified facts' if hostvars[ssh_partner]['ansible_facts']['ssh_host_key_ed25519_public'] is defined
         else 'from ssh-keyscan (UNVERIFIED, partner not in play)' }}
  vars:
    ssh_partner: "{{ mysql_repl_slave if mysql_repl_role == 'master' else mysql_repl_master }}"
  when:
    - mysql_repl_role | default('') in ['master', 'slave']
  tags:
    - ssh
    - known_hosts

- name: Set .ssh ownership
  become: true
  ansible.builtin.file:
    path: "{{ item.home }}/.ssh"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    recurse: true
  loop:
    - { home: '/root', owner: 'root', group: 'root' }
    - { home: "{{ ansible_facts['user_dir'] }}", owner: "{{ ansible_facts['user_id'] }}", group: "{{ ansible_facts['user_gid'] }}" }
  tags:
    - ssh
    - known_hosts

# NOTE: auto_provision_nodes_items is set in common role
- name: Trust cluster masters from provision server
  block:
    - name: Build master hostname and IP lists
      ansible.builtin.set_fact:
        ssh_hosts: "{{ auto_provision_nodes_items | map(attribute='value.hostname') | list }}"
        ssh_host_ip: "{{ auto_provision_nodes_items | map(attribute='value.ip') | list }}"

    - name: Add masters to known_hosts by hostname
      become: true
      ansible.builtin.known_hosts:
        path: "{{ item.0.path }}/{{ ssh_known_hosts_file }}"
        name: "{{ item.1 }}"
        state: present
        key: "{{ lookup('pipe', 'ssh-keyscan ' + item.1 + '') }}"
        hash_host: false
      loop: "{{ ssh_paths | product(ssh_hosts) }}"
      vars:
        ssh_paths:
          - { path: "/root" }
          - { path: "{{ ansible_facts['user_dir'] }}" }

    - name: Add masters to known_hosts by IP
      become: true
      ansible.builtin.known_hosts:
        path: "{{ item.0.path }}/{{ ssh_known_hosts_file }}"
        name: "{{ item.1 }}"
        state: present
        key: "{{ lookup('pipe', 'ssh-keyscan ' + item.1 + '') }}"
        hash_host: false
      loop: "{{ ssh_paths | product(ssh_host_ip) }}"
      vars:
        ssh_paths:
          - { path: "/root" }
          - { path: "{{ ansible_facts['user_dir'] }}" }

    - name: Authorize provision keys on masters
      become: true
      delegate_to: "{{ item.1 }}"
      ansible.builtin.authorized_key:
        user: "{{ item.0.user1 }}"
        state: present
        key: "{{ lookup('file', '../config/ssh/id_rsa_' + item.0.user2 + '_' + inventory_hostname + '.pub') }}"
        # Key only works when the connection comes from this provision server
        key_options: 'from="{{ hostvars[inventory_hostname].public_ipv4_address }}"'
      loop: "{{ ssh_users | product(ssh_hosts) }}"
      vars:
        ssh_users:
          - { user1: "root", user2: "root" }
          - { user1: "root", user2: "{{ ansible_facts['user_id'] }}" }
          - { user1: "{{ ansible_facts['user_id'] }}", user2: "{{ ansible_facts['user_id'] }}" }
          - { user1: "{{ ansible_facts['user_id'] }}", user2: "root" }

  when: auto_provision_host | default(false) | bool
  tags:
    - ssh
    - known_hosts
