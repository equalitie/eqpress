---
- name: Deploy .bashrc for admin user
  ansible.builtin.template:
    src: etc/skel/.bashrc.j2
    dest: ~/.bashrc
    mode: "0600"
  tags:
    - common

- name: Deploy .bashrc for root
  become: true
  ansible.builtin.template:
    src: etc/skel/.bashrc.j2
    dest: /root/.bashrc
    mode: "0600"
  tags:
    - common

- name: Set hostname
  become: true
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
    use: systemd
  when: not is_local
  tags:
    - common

- name: Check for cloud-init config directory
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg.d
  register: cloud_cfg_d
  when: not is_local
  tags:
    - common

- name: Stop cloud-init from resetting hostname at boot
  become: true
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-eqpress-hostname.cfg
    content: |
      # Managed by Ansible (eqpress common role), do not edit
      preserve_hostname: true
    owner: root
    group: root
    mode: "0644"
  when:
    - not is_local
    - cloud_cfg_d.stat.exists | default(false)
  tags:
    - common

- name: Update apt cache and run dist-upgrade
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist
  tags:
    - common
    - apt_upgrade

- name: Check if a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required
  tags:
    - common
    - apt_upgrade

- name: Read packages that require a reboot
  ansible.builtin.slurp:
    src: /var/run/reboot-required.pkgs
  register: reboot_required_pkgs
  failed_when: false
  when: reboot_required.stat.exists
  tags:
    - common
    - apt_upgrade

- name: Report reboot required
  ansible.builtin.debug:
    msg: >-
      REBOOT REQUIRED on {{ inventory_hostname }}:
      {{ (reboot_required_pkgs.content | default('') | b64decode).split() | unique | join(', ') | default('reason unknown', true) }}
  when: reboot_required.stat.exists
  tags:
    - common
    - apt_upgrade

- name: Install server-only packages
  become: true
  ansible.builtin.apt:
    name:
      - bc
      - iotop
      - logrotate
      - strace
      - ssl-cert
      - acl
    state: present
  when: not is_local
  tags:
    - common

- name: Install common packages
  become: true
  ansible.builtin.apt:
    name:
      - bash-completion
      - cron
      - curl
      - dnsutils
      - gawk
      - less
      - lsof
      - openssl
      - perl
      - rsync
      - screen
      - sudo
      - tzdata
      - unzip
      - vim
      - zip
      - bzip2
      - locales
    state: present
  tags:
    - common

- name: Configure /etc/default/locale
  become: true
  ansible.builtin.template:
    src: etc/default/locale.j2
    dest: /etc/default/locale
    owner: root
    group: root
    mode: "0644"
  tags:
    - common

- name: Generate locale
  become: true
  ansible.builtin.locale_gen:
    name: "{{ locale_lang }}"
    state: present
  tags:
    - common

- name: Set timezone
  become: true
  ansible.builtin.timezone:
    name: "{{ timezone }}"
  tags:
    - tzone
    - timezone
    - common

- name: Add master to /etc/hosts on slave
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/hosts
    regexp: '\s{{ mysql_repl_master | regex_escape }}(\s|$)'
    line: "{{ hostvars[mysql_repl_master].public_ipv4_address + ' ' + mysql_repl_master }}"
    state: present
  when:
    - mysql_repl_role is defined
    - mysql_repl_role == 'slave'
    - mysql_repl_master is defined
  tags:
    - common

- name: Add slave to /etc/hosts on master
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/hosts
    regexp: '\s{{ mysql_repl_slave | regex_escape }}(\s|$)'
    line: "{{ hostvars[mysql_repl_slave].public_ipv4_address + ' ' + mysql_repl_slave }}"
    state: present
  when:
    - mysql_repl_role is defined
    - mysql_repl_role == 'master'
    - mysql_repl_slave is defined
  tags:
    - common

- name: Parse provision node list
  ansible.builtin.set_fact:
    auto_provision_nodes_items: "{{ auto_provision_nodes | from_json | dict2items }}"
  when: auto_provision_host | default(false) | bool
  tags:
    - ssh
    - known_hosts
    - common

- name: Add cluster nodes to /etc/hosts on provision server
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/hosts
    regexp: '\s{{ item["value"].hostname | regex_escape }}(\s|$)'
    line: "{{ item['value'].ip + ' ' + item['value'].hostname + ' # ' + item['key'] + ' cluster' }}"
    state: present
  when: auto_provision_host | default(false) | bool
  loop: "{{ auto_provision_nodes_items }}"
  tags:
    - common
