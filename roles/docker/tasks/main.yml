---
- name: Install Docker (only when nginx runs in Docker)
  block:
    - name: Remove unofficial Docker packages
      become: true
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-compose-v2
          - docker-doc
          - podman-docker
          - containerd
          - runc
        state: absent

    - name: Install gpg for key verification
      become: true
      ansible.builtin.apt:
        name: gpg
        state: present

    # Download to a temporary file and only trust it if the fingerprint
    # matches Docker's published one.
    - name: Download Docker apt signing key
      become: true
      ansible.builtin.get_url:
        url: "{{ docker_gpg_key_url }}"
        dest: "{{ docker_gpg_keyring }}.new"
        mode: "0644"
        force: true
      changed_when: false

    - name: Read Docker apt signing key fingerprint
      ansible.builtin.command:
        argv: [gpg, --show-keys, --with-colons, --fixed-list-mode, "{{ docker_gpg_keyring }}.new"]
      register: docker_key_info
      changed_when: false
      check_mode: false

    - name: Check Docker apt signing key fingerprint
      ansible.builtin.assert:
        that:
          - docker_gpg_fingerprint in (docker_key_info.stdout_lines | select('match', '^fpr:') | map('split', ':') | map(attribute=9) | list)
        fail_msg: "Docker apt key at {{ docker_gpg_key_url }} does not have the expected fingerprint {{ docker_gpg_fingerprint }}; not installing it."
        quiet: true

    - name: Install verified Docker apt signing key
      become: true
      ansible.builtin.copy:
        src: "{{ docker_gpg_keyring }}.new"
        dest: "{{ docker_gpg_keyring }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"

    - name: Remove temporary Docker key file
      become: true
      ansible.builtin.file:
        path: "{{ docker_gpg_keyring }}.new"
        state: absent
      changed_when: false

    # amd64 is hardcoded on purpose: we only run amd64 servers, and pinning it
    # avoids images/packages for another architecture being used by mistake
    # (this once happened with an image built on a non-amd64 workstation).
    - name: Install Docker repo
      become: true
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "{{ docker_repo }}"
        suites: "{{ ansible_facts['distribution_release'] }}"
        architectures: amd64
        components: stable
        signed_by: "{{ docker_gpg_keyring }}"

    - name: Install Docker packages
      become: true
      ansible.builtin.apt:
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Install dockerd daemon config
      become: true
      ansible.builtin.template:
        src: docker_daemon.json.j2
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
      notify:
        - reload_docker

  when:
    - web_server_docker | bool
  tags:
    - nginx
    - docker

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
  tags:
    - nginx
    - docker
