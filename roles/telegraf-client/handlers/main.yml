---
# ignore_errors on purpose: press.yml uses any_errors_fatal, and a failed
# monitoring agent restart should not abort the deploy on every node.
# telegraf-buildconf checks the config and alerts if telegraf does not run.
- name: restart_telegraf
  become: true
  ansible.builtin.systemd_service:
    state: restarted
    name: telegraf
  ignore_errors: true

- name: systemd_daemon_reload
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: enable_timer_telegraf-buildconf
  become: true
  ansible.builtin.systemd_service:
    name: telegraf-buildconf.timer
    enabled: true
    state: restarted
