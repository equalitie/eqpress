---
- name: Check controller Ansible is {{ min_ansible_version }} or newer
  ansible.builtin.assert:
    that:
      - ansible_version.full is version(min_ansible_version, '>=')
    fail_msg: "FAILED - found Ansible {{ ansible_version.full }}, requires {{ min_ansible_version }} or newer"
    success_msg: "Ansible {{ ansible_version.full }}"
  run_once: true

- name: Check host is Ubuntu {{ min_distribution_version }} or newer
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] is version(min_distribution_version, '>=')
    fail_msg: "FAILED - found '{{ ansible_facts['distribution'] }}' version '{{ ansible_facts['distribution_version'] }}', requires Ubuntu {{ min_distribution_version }} or newer"
    success_msg: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"

- name: Check play-set variables are defined
  ansible.builtin.assert:
    that:
      - is_local is defined
    fail_msg: "FAILED - 'is_local' variable not set by the playbook"
    quiet: true
