---
- debug:
    msg: "{{ ansible_version }}"

- name: Check host is Ubuntu {{ min_distribution_version }} or newer
  ansible.builtin.fail:
    msg: "FAILED - found '{{ ansible_distribution }}' version '{{ ansible_distribution_version }}', requires Ubuntu {{ min_distribution_version }} or newer"
  when:
    - ansible_distribution_version is version(min_distribution_version,'<') or ansible_distribution != 'Ubuntu'

- name: check that play set variables are set
  ansible.builtin.fail:
    msg: "FAILED - '{{ item }}' variable not set"
  when: "item is not defined" 
  loop:
    - is_local
