---
- name: install software
  become: yes
  ansible.builtin.apt:
    name:
      - ufw
    state: present

# ufw stays enabled during the run. Rules apply live, so SSH must be
# allowed before the default incoming policy is set to deny.
- name: Find the SSH port Ansible is connected on
  ansible.builtin.set_fact:
    ufw_ssh_ports: >-
      {{ ([ssh_port | default('22') | string]
          + ((ansible_facts['env']['SSH_CONNECTION'] | default('')).split()[3:4]))
         | unique }}

- name: Allow SSH
  become: yes
  ansible.builtin.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_ssh_ports }}"

- name: use edgespermit script
  become: yes
  ansible.builtin.template:
    src: edgespermit.j2
    dest: /usr/local/sbin/edgespermit
    owner: root
    group: root
    mode: '0750'
  when: method_allowedges
  tags:
    - nginx
    - edgespermit

- name: allow web port to all if not using edgepermit script
  become: yes
  ansible.builtin.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { rule: 'allow', port: '80', proto: 'tcp' }
    - { rule: 'allow', port: '443', proto: 'tcp' }
  when: not method_allowedges

- name: Enable ufw logging
  become: yes
  ansible.builtin.ufw:
    logging: "on"

- name: enable mysql port 
  become: yes
  ansible.builtin.ufw:
    rule: allow
    port: "3306"
    proto: tcp
    from_ip: "{{ hostvars[ item ][ 'public_ipv4_address' ] }}/32"
  when: not auto_provision_host | default(false) | bool
  loop: "{{ play_hosts }}"

- name: Configure ufw defaults
  become: yes
  ansible.builtin.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }

- name: copy ufw override sysctl.conf
  become: yes
  ansible.builtin.copy:
    src: sysctl.conf
    dest: /etc/ufw/sysctl.conf
    owner: root
    group: root
    mode: 0644
  register: ufw_sysctl

# Previously the disable/enable cycle applied sysctl changes on every run.
- name: Reload ufw to apply sysctl changes
  become: yes
  ansible.builtin.ufw:
    state: reloaded
  when: ufw_sysctl is changed

- name: enable ufw
  become: yes
  ansible.builtin.ufw:
    state: enabled
