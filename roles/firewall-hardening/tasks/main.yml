---
- name: install software
  become: yes
  ansible.builtin.apt:
    name:
      - ufw
    state: present

# ufw stays enabled during the run. Rules apply live, so SSH must be
# allowed before the default incoming policy is set to deny.
- name: Find the SSH port Ansible is connected on
  ansible.builtin.set_fact:
    ufw_ssh_ports: >-
      {{ ([ssh_port | default('22') | string]
          + ((ansible_facts['env']['SSH_CONNECTION'] | default('')).split()[3:4]))
         | unique }}

- name: Allow SSH
  become: yes
  ansible.builtin.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_ssh_ports }}"

- name: use edgespermit script
  become: yes
  ansible.builtin.template:
    src: edgespermit.j2
    dest: /usr/local/sbin/edgespermit
    owner: root
    group: root
    mode: '0750'
  when: method_allowedges
  tags:
    - nginx
    - edgespermit

- name: allow web port to all if not using edgepermit script
  become: yes
  ansible.builtin.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { rule: 'allow', port: '80', proto: 'tcp' }
    - { rule: 'allow', port: '443', proto: 'tcp' }
  when: not method_allowedges

- name: Enable ufw logging
  become: yes
  ansible.builtin.ufw:
    logging: "on"

# Only the replication partner needs MySQL over the network: the slave
# replicates from the master and runs check_mysql_replication_status.sh
# against it. Both directions are allowed so a promoted slave still works.
# Local connections (sites, telegraf, provision playbooks) use the socket or lo.
- name: Allow MySQL from replication partner
  become: yes
  ansible.builtin.ufw:
    rule: allow
    port: "3306"
    proto: tcp
    from_ip: "{{ hostvars[mysql_repl_partner]['public_ipv4_address'] }}/32"
  vars:
    mysql_repl_partner: "{{ mysql_repl_slave if mysql_repl_role == 'master' else mysql_repl_master }}"
  when:
    - not auto_provision_host | default(false) | bool
    - mysql_repl_role | default('') in ['master', 'slave']

- name: List MySQL firewall rules
  become: yes
  ansible.builtin.command: ufw status
  register: ufw_status_mysql
  changed_when: false
  check_mode: false
  when:
    - not auto_provision_host | default(false) | bool
    - mysql_repl_role | default('') in ['master', 'slave']

- name: Report MySQL rules not from replication partner
  ansible.builtin.debug:
    msg: "Extra MySQL rules on {{ inventory_hostname }} (not removed, check by hand): {{ mysql_extra_rules }}"
  vars:
    mysql_repl_partner: "{{ mysql_repl_slave if mysql_repl_role == 'master' else mysql_repl_master }}"
    mysql_partner_ip: "{{ hostvars[mysql_repl_partner]['public_ipv4_address'] }}"
    mysql_extra_rules: >-
      {{ ufw_status_mysql.stdout_lines
         | select('match', '^3306/tcp\s')
         | reject('search', '\s' ~ (mysql_partner_ip | regex_escape) ~ '(/32)?(\s|$)')
         | map('regex_replace', '\s+', ' ')
         | list }}
  when:
    - ufw_status_mysql is not skipped
    - mysql_extra_rules | length > 0

- name: Configure ufw defaults
  become: yes
  ansible.builtin.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }

- name: copy ufw override sysctl.conf
  become: yes
  ansible.builtin.copy:
    src: sysctl.conf
    dest: /etc/ufw/sysctl.conf
    owner: root
    group: root
    mode: 0644
  register: ufw_sysctl

# Previously the disable/enable cycle applied sysctl changes on every run.
- name: Reload ufw to apply sysctl changes
  become: yes
  ansible.builtin.ufw:
    state: reloaded
  when: ufw_sysctl is changed

- name: enable ufw
  become: yes
  ansible.builtin.ufw:
    state: enabled
