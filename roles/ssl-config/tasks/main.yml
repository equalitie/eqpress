---
# The private CA lives on the controller in config/ssl (ssl_local_dir).
# Controller-side tasks run as the local user, never with sudo.

- name: Check for CA serial file
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ ssl_local_dir }}/serial.txt"
  register: local_ssl_serial
  run_once: true
  tags:
    - ssl

- name: Check for CA index file
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ ssl_local_dir }}/index.txt"
  register: local_ssl_index
  run_once: true
  tags:
    - ssl

- name: Create CA serial file
  delegate_to: localhost
  become: false
  ansible.builtin.copy:
    dest: "{{ ssl_local_dir }}/serial.txt"
    content: "01"
  when: not local_ssl_serial.stat.exists
  run_once: true
  tags:
    - ssl

- name: Create CA index file
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    dest: "{{ ssl_local_dir }}/index.txt"
    state: touch
  when: not local_ssl_index.stat.exists
  run_once: true
  tags:
    - ssl

- name: Write root CA openssl config
  delegate_to: localhost
  become: false
  ansible.builtin.template:
    src: genRootCA.conf.j2
    dest: "{{ ssl_local_dir }}/genRootCA.conf"
    mode: "0640"
  run_once: true
  tags:
    - ssl

- name: Write root CA script
  delegate_to: localhost
  become: false
  ansible.builtin.template:
    src: genRootCA.sh.j2
    dest: "{{ ssl_local_dir }}/genRootCA.sh"
    mode: "0750"
  run_once: true
  tags:
    - ssl

- name: Create root CA
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    cmd: ./genRootCA.sh
    chdir: "{{ ssl_local_dir }}"
    creates: root_CA.key
  run_once: true
  tags:
    - ssl

- name: Create host key and CSR
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    chdir: "{{ ssl_local_dir }}"
    creates: "{{ inventory_hostname }}.key"
    cmd: "openssl req -new -newkey rsa:2048 -nodes -out {{ inventory_hostname }}.csr -keyout {{ inventory_hostname }}.key -subj \"/C={{ root_cert_country }}/ST={{ root_cert_state }}/L={{ root_cert_city }}/O={{ org_name }}/CN={{ inventory_hostname }}\""
  tags:
    - ssl

- name: Write host signing script and config
  delegate_to: localhost
  become: false
  ansible.builtin.template:
    src: "{{ item.file }}.j2"
    dest: "{{ ssl_local_dir }}/{{ item.file }}"
    mode: "{{ item.mode }}"
  loop:
    - { file: "sign_webserver.sh", mode: "0750" }
    - { file: "sign_webserver.conf", mode: "0644" }
  run_once: true
  tags:
    - ssl

# openssl ca updates serial.txt and index.txt; signing two hosts at once
# can give duplicate serials or a corrupt index, so sign one at a time.
- name: Sign host certificate
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    chdir: "{{ ssl_local_dir }}"
    creates: "{{ inventory_hostname }}.pem"
    cmd: "./sign_webserver.sh {{ inventory_hostname }}"
  throttle: 1
  tags:
    - ssl

# The CA key and host keys have no passphrase; keep them readable only by
# the controller user that runs Ansible.
- name: Find private keys on controller
  delegate_to: localhost
  become: false
  ansible.builtin.find:
    paths: "{{ ssl_local_dir }}"
    patterns: "*.key"
  register: local_ssl_keys
  run_once: true
  tags:
    - ssl

- name: Restrict private keys on controller to owner only
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0600"
  loop: "{{ local_ssl_keys.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  run_once: true
  tags:
    - ssl

# Read-only reminder; nothing renews certificates automatically.
# openssl -checkend: rc 0 = still valid past the window, rc 1 = expires within it.
- name: Check certificate expiry on controller
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -noout
      - -enddate
      - -checkend
      - "{{ ssl_cert_expiry_warn_days | int * 86400 }}"
      - -in
      - "{{ ssl_local_dir }}/{{ item }}.pem"
  loop: "{{ ansible_play_hosts + ['root_CA'] }}"
  # Skip certs not created yet (e.g. a new host in --check mode)
  when: (ssl_local_dir ~ '/' ~ item ~ '.pem') is file
  register: ssl_cert_expiry
  changed_when: false
  failed_when: ssl_cert_expiry.rc > 1 or 'notAfter=' not in ssl_cert_expiry.stdout
  check_mode: false
  run_once: true
  tags:
    - ssl

- name: Warn about certificates expiring soon
  ansible.builtin.debug:
    msg: >-
      CERTIFICATE EXPIRING within {{ ssl_cert_expiry_warn_days }} days:
      {{ ssl_expiring | map(attribute='item')
         | zip(ssl_expiring | map(attribute='stdout_lines') | map('first'))
         | map('join', ' ') | join('; ') }}
  vars:
    # skipped results (no cert yet) have no rc
    ssl_expiring: >-
      {{ ssl_cert_expiry.results | rejectattr('skipped', 'defined')
         | selectattr('rc', 'equalto', 1) | list }}
  when: ssl_expiring | length > 0
  run_once: true
  tags:
    - ssl

- name: Create {{ ssl_key_directory }} on server
  become: true
  ansible.builtin.file:
    path: "{{ ssl_key_directory }}"
    state: directory
    owner: root
    group: ssl-cert
    mode: "0750"
  tags:
    - ssl

- name: Copy host key, host cert and CA cert to server
  become: true
  ansible.builtin.copy:
    src: "{{ ssl_local_dir }}/{{ item.name }}"
    dest: "{{ ssl_key_directory }}"
    owner: root
    group: ssl-cert
    mode: "{{ item.perms }}"
  loop:
    - { name: "{{ inventory_hostname }}.pem", perms: "0444" }
    - { name: "{{ inventory_hostname }}.key", perms: "0440" }
    - { name: "root_CA.pem", perms: "0444" }
  tags:
    - ssl
