---
- name: Install base packages
  become: true
  ansible.builtin.apt:
    name:
      - git
      - rsyslog
    state: present
  tags:
    - sysops

- name: Remove legacy monit
  become: true
  ansible.builtin.apt:
    name:
      - monit
    state: absent
    purge: true
    autoremove: true
  tags:
    - sysops
    - remove_monit

# It is okay if server is minimize. Stop telling us
- name: Remove unminimize login message
  become: true
  ansible.builtin.file:
    path: /etc/update-motd.d/60-unminimize
    state: absent
  tags:
    - sysops

- name: Add .ssh directory to /etc/skel
  become: true
  ansible.builtin.file:
    path: /etc/skel/.ssh
    owner: root
    group: root
    mode: "0700"
    state: directory
  tags:
    - sysops

- name: Add authorized_keys file to /etc/skel
  become: true
  ansible.builtin.file:
    path: /etc/skel/.ssh/authorized_keys
    owner: root
    group: root
    mode: "0600"
    state: touch
    # only create when missing; do not bump timestamps every run
    modification_time: preserve
    access_time: preserve
  tags:
    - sysops

- name: Create admin groups
  become: true
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop:
    - monitor
    - wordpress
  tags:
    - sysops

- name: Create admin users
  become: true
  ansible.builtin.user:
    group: "{{ item.group }}"
    shell: /bin/bash
    name: "{{ item.user }}"
    createhome: true
    home: "/home/{{ item.user }}"
  loop:
    - { user: "monitor", group: "monitor" }
    - { user: "wordpress", group: "wordpress" }
  tags:
    - sysops

- name: Create sftponly group for chrooted logins
  become: true
  ansible.builtin.group:
    name: sftponly
    state: present
  when:
    - mysql_repl_role is defined
  tags:
    - sysops

- name: Install sshd_config
  become: true
  ansible.builtin.copy:
    src: etc/ssh/sshd_config
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0644"
    # Refuse to install a config sshd cannot parse (would block new logins)
    validate: /usr/sbin/sshd -t -f %s
  when:
    - mysql_repl_role is defined
  notify:
    - sshd_reload
  tags:
    - sysops
    - sshd_config

- name: Create any missing SSH host keys
  become: true
  ansible.builtin.command:
    cmd: /usr/bin/ssh-keygen -A
  register: ssh_keygen_all
  # ssh-keygen -A is silent unless it had to create a missing host key
  changed_when: "'generating new host keys' in ssh_keygen_all.stdout"
  when:
    - mysql_repl_role is defined
  tags:
    - sysops

- name: Install sudoers
  become: true
  ansible.builtin.copy:
    src: etc/sudoers
    dest: /etc/sudoers
    owner: root
    group: root
    mode: "0440"
    # Refuse to install a sudoers file with errors (would break sudo/Ansible)
    validate: /usr/sbin/visudo -cf %s
  tags:
    - sysops

- name: Set /usr/local/sbin ownership and mode
  become: true
  ansible.builtin.file:
    path: /usr/local/sbin
    owner: root
    group: root
    mode: "0755"
  tags:
    - sysops
    - sbin

- name: Install press admin scripts
  become: true
  ansible.builtin.copy:
    src: "usr/local/sbin/{{ item }}"
    dest: /usr/local/sbin
    owner: root
    group: staff
    mode: "0755"
  loop:
    - chcustown
    - chepown
    - chwebown
    - check-mem.pl
    - check_size_of_php_error_logs.sh
    - class-http-log-parser.php
    - eq_admin_emails.sh
    - eq_deactivate_site.sh
    - eq_get_sftp_user.sh
    - eq_plugin_blacklist.php
    - eq_purge_site.sh
    - purge_site
    - eq_purge_cache.sh
    - eq_security_scan.sh
    - eq_setup_replication.sh
    - eq_unprovision.sh
    - eq_update_wp.sh
    - monit_check_mailq.sh
    - monit_connections.sh
    - monit_php-fpm_procs.sh
    - monitor_nginx.pl
    - resident-ram
    - top_ram_procs.sh
    - wpcli_woocommerce_disable_redirect.php
    - wpcli_wordfence_no_scan.php
    - wp_check_plugins.php
    - wp_update_plugins.sh
    - htpasswd.php
    - field
  tags:
    - sysops
    - sbin
  when:
    - mysql_repl_role is defined

- name: Install admin scripts on provision server
  become: true
  ansible.builtin.copy:
    src: "usr/local/sbin/{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: staff
    mode: "0755"
  loop:
    - check-mem.pl
    - class-http-log-parser.php
    - monit_check_mailq.sh
    - monit_connections.sh
    - resident-ram
    - top_ram_procs.sh
    - field
  when: auto_provision_host | default(false) | bool
  tags:
    - sysops
    - provision
    - sbin

# Used by the monitoring checks on every server (press and provision) to
# email the monitoring address when a check changes state.
- name: Install monitoring alert helper
  become: true
  ansible.builtin.template:
    src: usr/local/sbin/eqpress_alert.sh.j2
    dest: /usr/local/sbin/eqpress_alert.sh
    owner: root
    group: staff
    mode: "0755"
  tags:
    - sysops
    - sbin

- name: Install templated press admin scripts
  become: true
  ansible.builtin.template:
    src: "usr/local/sbin/{{ item }}.j2"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: staff
    mode: "0750"
  loop:
    - check_for_disk_usage.sh
    - check_for_large_files.sh
    - check_for_large_http_log_files.sh
    - chpass.sh
    - bruteprotect.sh
    - deploy_must_use_plugins.sh
    - install_console.sh
    - install_cache_purge.sh
    - monit_console_reset_password.sh
    - monit_console_lockdown.sh
    - monit_console_perms.sh
    - nagios_check_mysql.php
    - site_snapshot.sh
    - gen_api_key.php
    - press_setperms
  tags:
    - sysops
    - sbin
  when:
    - mysql_repl_role is defined

- name: Install slave-only scripts
  become: true
  ansible.builtin.template:
    src: "usr/local/sbin/{{ item }}.j2"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: staff
    mode: "0750"
  when:
    -  mysql_repl_role is defined
    -  mysql_repl_role == 'slave'
  loop:
    - check_mysql_replication_status.sh
  tags:
    - sysops
    - sbin

- name: Install backup scripts
  become: true
  ansible.builtin.copy:
    src: "usr/local/sbin/{{ item }}"
    dest: /usr/local/sbin
    owner: root
    group: staff
    mode: "0750"
  loop:
    - backup_to_slave.sh
    - wp_db_backup.sh
    - backup_with_tarsnap.sh
    - site_snapshot_tool.sh
  tags:
    - sysops
    - sbin
  when:
    - mysql_repl_role is defined

- name: Install webstats scripts
  become: true
  ansible.builtin.template:
    src: "usr/local/sbin/{{ item }}.j2"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: staff
    mode: "0755"
  loop:
    - api_webstats.php
    - webstats.php
    - webstats_totals.php
  when:
    - mysql_repl_role is defined
  tags:
    - sysops
    - sbin

- name: Install deprecated failover script on slave
  become: true
  ansible.builtin.template:
    src: "usr/local/sbin/master_or_slave.sh.j2"
    dest: /usr/local/sbin/master_or_slave.sh
    owner: root
    group: staff
    mode: "0750"
  when:
    - mysql_repl_role is defined
    - mysql_repl_role == 'slave'
    - mysql_repl_master is defined
  tags:
    - sysops
    - sbin

- name: Install backup_from_master.sh on slave
  become: true
  ansible.builtin.template:
    src: usr/local/sbin/backup_from_master.sh.j2
    dest: /usr/local/sbin/backup_from_master.sh
    owner: root
    group: staff
    mode: "0750"
  when:
    - mysql_repl_role is defined
    - mysql_repl_role == 'slave'
    - mysql_repl_master is defined
  tags:
    - sysops
    - sbin

- name: Install provision server scripts
  become: true
  ansible.builtin.template:
    src: "usr/local/sbin/{{ item }}.j2"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0750"
  tags:
    - sysops
    - provision_gpg
    - sbin
  loop:
    - monit_provision.sh
  when: auto_provision_host | default(false) | bool

# Applies to login sessions and cron jobs only (PAM). Services set their own:
# MariaDB via mariadb.service.d LimitNOFILE (mariadb-local-service),
# nginx via worker_rlimit_nofile (nginx-web-services).
- name: Install limits.conf
  become: true
  ansible.builtin.copy:
    src: etc/security/limits.conf
    dest: /etc/security/limits.conf
    owner: root
    group: root
    mode: "0644"
  tags:
    - sysops

- name: Install crontab (daily jobs at 1am for webstats)
  become: true
  ansible.builtin.copy:
    src: etc/crontab
    dest: /etc/crontab
    owner: root
    group: root
    mode: "0644"
  tags:
    - sysops

- name: Install wp-cli
  become: true
  ansible.builtin.get_url:
    url: "{{ wp_cli_download }}"
    # wp-cli publishes a .sha512 next to each build; refuse a file that does not match
    checksum: "sha512:{{ wp_cli_download }}.sha512"
    dest: /usr/local/sbin/wp
    owner: root
    group: root
    mode: "0755"
    force: true
  when:
    - mysql_repl_role is defined
    - wp_cli_newest is defined
    - wp_cli_download is defined
    - wp_cli_newest
  tags:
    - sysops
    - sbin

- name: Create eqpress base directory
  become: true
  ansible.builtin.file:
    path: "{{ eqpress_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - sysops

- name: Create web group
  become: true
  ansible.builtin.group:
    name: "{{ web_groupname }}"
    gid: "{{ web_gid }}"
    system: true
  tags:
    - sysops

- name: Create web user
  become: true
  ansible.builtin.user:
    name: "{{ web_user }}"
    uid: "{{ web_uid }}"
    group: "{{ web_groupname }}"
    shell: "{{ web_user_shell }}"
    home: "{{ web_user_home }}"
    comment: "{{ web_user_comment }}"
    create_home: false
    system: true
  tags:
    - sysops
