---
- name: systemd_daemon_reload
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: restart cron
  become: true
  ansible.builtin.systemd_service:
    name: cron
    state: restarted

- name: enable_timer_edgespermit
  become: true
  ansible.builtin.systemd_service:
    name: edgespermit.timer
    enabled: true
    state: restarted

- name: enable_timer_mon_provision
  become: true
  ansible.builtin.systemd_service:
    name: mon_provision.timer
    enabled: true
    state: restarted

- name: enable_timer_mon_connections
  become: true
  ansible.builtin.systemd_service:
    name: mon_connections.timer
    enabled: true
    state: restarted

- name: enable_timer_mon_check-mailq
  become: true
  ansible.builtin.systemd_service:
    name: mon_check-mailq.timer
    enabled: true
    state: restarted

- name: enable_timer_mon_press-console-perms
  become: true
  ansible.builtin.systemd_service:
    name: mon_press-console-perms.timer
    enabled: true
    state: restarted

- name: enable_timer_mon_press-console-lockdown
  become: true
  ansible.builtin.systemd_service:
    name: mon_press-console-lockdown.timer
    enabled: true
    state: restarted

- name: enable_timer_mon_press-reset-password
  become: true
  ansible.builtin.systemd_service:
    name: mon_press-reset-password.timer
    enabled: true
    state: restarted

- name: noop
  ansible.builtin.debug:
    msg: "noop"
